/* dashboard + logos refresh */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.dash-panel{background:#11182d;border:1px solid #26304d;border-radius:28px;padding:26px 28px;color:#eef3ff;box-shadow:0 10px 30px rgba(10,18,40,.18)}
.dash-panel h2{font-size:22px;margin:0 0 10px;color:#fff}
.dash-panel .dim,.dash-panel .small{color:#9aa5c2}
.dash-panel .btn.secondary{background:transparent;border-color:#394462;color:#fff}
.dash-row{display:flex;align-items:flex-start;gap:14px;padding:18px 0;border-top:1px solid #27314d}
.dash-row:first-child{border-top:0}
.dash-row .grow{min-width:0}
.dash-check{width:18px;height:18px;border-radius:6px;border:2px solid #34415f;display:grid;place-items:center;flex:0 0 auto;margin-top:2px;background:#19233d;color:#fff;font-size:12px;line-height:1}
.dash-check.done{background:#58c48c;border-color:#58c48c}
.dash-title{font-weight:760;font-size:17px;color:#fff;line-height:1.35}
.dash-title.done{text-decoration:line-through;color:#a0aac5}
.dash-sub{color:#9aa5c2;font-size:12px;margin-top:4px}
.dash-tag{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-weight:760;font-size:12px;white-space:nowrap;flex:0 0 auto;border:1px solid transparent}
.dash-tag.deadline{background:#5a3913;color:#ffb75f}
.dash-tag.network{background:#34204c;color:#c4a0ff}
.dash-tag.interview{background:#1b2d69;color:#8eb0ff}
.dash-tag.done{background:#183a31;color:#6cdaa6}
.dash-tag.event{background:#1e2d69;color:#89a8ff}
.dash-tag.muted{background:#192540;color:#dbe6ff;border-color:#3b4566}
.dash-card-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.dash-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;background:#5a3913;color:#ffb75f;font-weight:800}
.dash-badge.blue{background:#1d2d67;color:#89a8ff}
.dash-badge.clear{background:transparent;border:1px solid #31405f;color:#fff}
.dashboard-topnote{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#eef4ff;border:1px solid #d8e4f8;border-radius:18px;padding:16px 18px;margin-bottom:18px}
.dashboard-topnote strong{font-size:18px}
.dashboard-topnote .metric{display:flex;align-items:baseline;gap:10px}
.dashboard-topnote .metric b{font-size:32px;color:#1a355c}
.home-toggle{margin-bottom:16px}
.peer-row,.cdo-row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid #27314d}
.peer-row:first-child,.cdo-row:first-child{border-top:0}
.peer-bubble{width:48px;height:48px;border-radius:999px;background:#32204e;color:#d7c2ff;display:grid;place-items:center;font-weight:850;font-size:24px;flex:0 0 auto}
.cdo-day{min-width:58px;height:40px;border-radius:999px;background:#1d2d67;color:#8da9ff;display:grid;place-items:center;font-weight:850;flex:0 0 auto}
.company-logo{width:42px;height:42px;border-radius:12px;border:1px solid #e2e8f3;background:#fff;object-fit:contain;display:block;padding:7px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.company-row{display:flex;align-items:flex-start;gap:14px;border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin-top:12px}
.company-head{display:flex;align-items:center;gap:12px}
.company-name{font-size:17px;font-weight:800;color:var(--ink)}
.company-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill.neutral{background:#f3f5f8;color:#67748b}
.firm-details summary{cursor:pointer;color:#8ea0bf;font-weight:700;list-style:none;margin-top:10px}
.firm-details summary::-webkit-details-marker{display:none}
.firm-details p{margin:10px 0 0}
.roadmap-shell.dark-roadmap{background:#11182d;border-color:#26304d;color:#edf1ff;border-radius:28px;padding:26px}
.dark-roadmap .section-title,.dark-roadmap h3,.dark-roadmap .roadmap-head{color:#fff}
.dark-roadmap .dim,.dark-roadmap .small,.dark-roadmap .source-note{color:#9aa5c2}
.dark-roadmap .field{background:#18213a;border-color:#33415e;color:#fff}
.dark-roadmap .field:focus{box-shadow:none;border-color:#5f7fd4}
.roadmap-stages{position:relative;margin-top:18px;padding-left:14px}
.roadmap-stages:before{content:'';position:absolute;left:37px;top:6px;bottom:6px;width:2px;background:#2a3553}
.roadmap-stage2{display:grid;grid-template-columns:230px 1fr;gap:20px;position:relative;padding:0 0 18px 0;margin-bottom:16px}
.roadmap-stage2 .roadmap-left{position:relative;padding-left:0}
.roadmap-stage2 .roadmap-dot{width:18px;height:18px;border-radius:999px;background:#11182d;border:3px solid #4e5e87;position:absolute;left:28px;top:10px;z-index:2}
.roadmap-stage2.current .roadmap-dot{background:#f0a953;border-color:#f0a953;box-shadow:0 0 0 6px rgba(240,169,83,.16)}
.roadmap-stage2 .when{font-size:15px;font-weight:800;color:#dfe6ff;padding-left:62px;line-height:1.35}
.roadmap-stage2 .when small{display:block;color:#9aa5c2;font-weight:600;margin-top:5px}
.roadmap-stage2 .roadmap-label{display:inline-block;margin-left:62px;margin-top:10px;padding:6px 11px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:.02em;background:#1d2744;color:#93a5d6}
.roadmap-stage2.current .roadmap-label{background:#f0a953;color:#24324b}
.roadmap-stage2 .roadmap-info{border:1px solid #27314d;border-radius:20px;padding:18px 18px 8px;background:#151d34}
.roadmap-stage2.current .roadmap-info{background:#4c3213;border-color:#6b4620}
.roadmap-stage2 h3{font-size:18px;margin:0 0 12px}
.roadmap-task2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid rgba(255,255,255,.08)}
.roadmap-task2:first-child{border-top:0}
.roadmap-task2 .grow{color:#ecf1ff}
.roadmap-task2 .task-status{min-width:140px}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}.roadmap-stage2{grid-template-columns:1fr}.roadmap-stages:before{display:none}.roadmap-stage2 .roadmap-dot{display:none}.roadmap-stage2 .when,.roadmap-stage2 .roadmap-label{margin-left:0;padding-left:0}}


/* Home dashboard — light, task-first */

function firmLogo(name){const f=consultingFirms.find(x=>x.name.toLowerCase()===String(name||'').toLowerCase());if(!f?.domain)return '';const domain=f.domain;if(domain==="mckinsey.com")return `<img class="firm-mini-logo" src="${MCKINSEY_UPLOADED_LOGO}" alt="McKinsey logo" loading="lazy">`;return `<img class="firm-mini-logo" src="https://logo.clearbit.com/${encodeURIComponent(domain)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64';}else{this.style.display='none';}">`}
function firmName(name){return `<span class="firm-inline">${firmLogo(name)}<span>${esc(name||'')}</span></span>`}
function notePlain(html){const x=document.createElement('div');x.innerHTML=html||'';return x.textContent||''}
function networking(){const firms=['All firms',...new Set(state.contacts.map(c=>c.company).filter(Boolean))].sort(),rows=state.contacts.filter(c=>(contactFirm==='All firms'||c.company===contactFirm)&&`${c.name} ${c.role} ${c.company}`.toLowerCase().includes(contactQuery.toLowerCase()));return `${head('','Networking','')}${tabs([['connections','Connections & CRM'],['outreach','Outreach assistant']],networkSection,'network-section')}${networkSection==='connections'?`<div class="card"><div class="between"><h2 class="section-title">Your connections</h2><button class="btn" data-modal="contact">+ Add contact</button></div><div class="contact-filters"><input id="contactSearch" class="field" placeholder="Search name, company or role" value="${esc(contactQuery)}"><select id="contactFirmFilter" class="field">${firms.map(f=>`<option ${f===contactFirm?'selected':''}>${esc(f)}</option>`).join('')}</select></div><div>${rows.map(c=>`<div class="contact-entry"><button class="contact-overview" data-expand-contact="${esc(c.id)}"><div class="avatar">${esc(c.name.charAt(0))}</div><div class="grow"><strong>${esc(c.name)}</strong><div class="small dim">${firmName(c.company)} · ${esc(c.role||'Contact')}</div></div>${pill(c.status)}<span class="small dim">${c.next?'Follow up '+fmt(c.next):''}</span><span class="contact-expand">${expandedContact===c.id?'⌃':'⌄'}</span></button>${expandedContact===c.id?`<div class="notes-panel"><div class="between"><b>Call notes</b><button class="btn ghost tiny" data-edit-contact="${c.id}">Edit contact</button></div><div class="notes-toolbar"><button data-format="bold" title="Bold">B</button><button data-format="italic" title="Italic"><i>I</i></button><button data-format="insertUnorderedList" title="Bullets">• List</button><button data-format="insertOrderedList" title="Numbered list">1. List</button><button data-format="highlight" title="Highlight">Highlight</button><button data-format="removeFormat" title="Clear formatting">Clear</button></div><div id="richNotes" class="rich-notes" contenteditable="true" role="textbox" aria-label="Call notes" aria-multiline="true">${c.notesHtml||esc(c.notes||'')}</div><div class="row" style="margin-top:13px"><button class="btn secondary tiny" id="saveRichNotes">Save notes</button><button class="btn secondary tiny" id="summarizeNotes">Generate summary</button><button class="btn" id="draftRichFollowup">Follow up →</button></div><div id="richSummary">${c.notesSummary?`<div class="notes-summary">${esc(c.notesSummary)}</div>`:''}</div><div id="richDraft"></div></div>`:''}</div>`).join('')||'<div class="empty">No contacts match your filters.</div>'}</div></div>`:`<div class="linkedinbox" style="max-width:800px"><h2 class="section-title">LinkedIn → personalized outreach</h2><form id="linkedinForm" style="margin-top:15px"><div class="formgrid">${[['LinkedIn URL','url','https://www.linkedin.com/in/...'],['Name','name','Contact name'],['Company','company','Firm / company'],['Role','role','Job title'],['Shared connection','shared','School or mutual connection']].map(([label,name,placeholder])=>`<div class="formgroup"><label>${label}</label><input class="field" name="${name}" placeholder="${placeholder}"></div>`).join('')}<div class="formgroup full"><label>Profile experience or About section</label><textarea class="field" name="bio" placeholder="Paste public profile text"></textarea></div></div><button class="btn" style="margin-top:12px">Generate summary & email</button></form><div id="linkedinResult"></div><p class="source-note">Public profile text is entered manually. Automated scraping and verified email discovery are not connected.</p></div>`}`}

<div class="case-grid"><div><div class="card"><div class="between"><h2 class="section-title">Your case structure template</h2><span class="pill blue">MECE + interviewer-led</span></div><p class="dim small">Open only the section you need while practicing.</p>${caseBlueprint()}</div><div class="card" style="margin-top:18px"><div class="between"><h2 class="section-title">External practice</h2><span class="dim small">Open in a new tab</span></div><div class="resource"><div><b>RocketBlocks</b><div class="dim small">Structuring, charts, brainstorming, math and consulting drills.</div></div><a class="btn secondary" href="https://www.rocketblocks.me/consulting.php" target="_blank" rel="noopener">Open ↗</a></div><div class="resource"><div><b>ZetaMac</b><div class="dim small">Fast arithmetic reps for multiplication, division, addition and subtraction.</div></div><a class="btn secondary" href="https://arithmetic.zetamac.com/" target="_blank" rel="noopener">Open ↗</a></div></div></div><div><div class="practicebox"><div class="between"><div><div class="eyebrow">Embedded full-case rep</div><h2 class="section-title" style="margin-top:5px">Case prompt</h2></div><div class="timer" id="caseTimer">${String(Math.floor(caseSeconds/60)).padStart(2,'0')}:${String(caseSeconds%60).padStart(2,'0')}</div></div><div class="prompt" style="margin:13px 0">${esc(c.prompt)}</div><div class="row"><button class="btn secondary" id="newCase">New prompt</button><button class="btn ghost" id="toggleCaseTimer">${caseTimer?'Pause timer':'Start timer'}</button></div><div class="formgroup" style="margin-top:13px"><label>Your repeat-back + clarifying questions</label><textarea class="field" id="caseClarify" placeholder="Just to make sure I got everything…"></textarea></div><div class="formgroup" style="margin-top:10px"><label>Your framework</label><textarea class="field" id="caseFramework" placeholder="I’d like to look at 3 main areas…"></textarea></div><div class="formgroup" style="margin-top:10px"><label>Your final recommendation</label><textarea class="field" id="caseRec" placeholder="Yes / no + evidence + risk + mitigant + next step"></textarea></div><div class="row" style="margin-top:11px"><button class="btn" id="saveCase">Save practice session</button><button class="btn secondary" id="revealCase">Reveal sample structure</button></div><div id="caseReveal"></div></div><div class="card" style="margin-top:18px"><div class="between"><h2 class="section-title">60-second mental math</h2><span class="pill">Score <b id="mathScore">${math.score}</b></span></div>${math.active?`<div class="between" style="margin-top:12px"><span class="dim">Time left</span><b id="mathLeft">${math.left}s</b></div><div class="mathq" id="mathQ">${math.a} ${math.op} ${math.b} = ?</div><input class="field" id="mathAnswer" inputmode="numeric" autocomplete="off" placeholder="Type answer + Enter">`:`<p class="dim">Mix multiplication, division, addition and subtraction. The next problem appears immediately after each answer.</p><button class="btn" id="startMath">Start 60s drill</button>`}</div><div class="card" style="margin-top:18px"><div class="between"><h2 class="section-title">Market sizing</h2><button class="btn ghost tiny" id="newSizing">New prompt</button></div><div class="prompt" id="sizingPrompt" style="margin-top:12px">${esc(marketSizing[0])}</div><textarea class="field" style="margin-top:10px" placeholder="Top-down: population → target segment → usage rate → frequency"></textarea></div></div></div>`}
function caseBlueprint(){return [
['1. Prompt → listen & take notes','Capture Who, What they do, the Problem / Task, and important numbers.'],
['2. Repeat back','“Just to make sure I got everything. We are working with our client ___ to ___. Am I missing anything?”'],
['3. Ask 2–4 clarifying questions','Product mix; goals; timeline; competitors; business model; prior attempts; anything genuinely unclear.'],
['4. Framework — be MECE','Common buckets: Financials (revenue / costs), Market, Risks, Capabilities, Customer, Competitive Landscape, Operations. Tailor the buckets to the prompt.'],
['5. Drive the case','Choose the most useful place to dive deeper. State what you want to analyze and why.'],
['6. Brainstorming','Take a moment, create 3–4 buckets with 2–4 ideas each. Profitability ideas: pricing, bundles, loyalty, new products, conversion, suppliers, operations. Market entry: build, acquire, JV / partnership, franchise.'],
['7. Charts & exhibits','Start with title + axes. Give 2–3 key takeaways, hypothesize why, then say what you want to investigate next.'],
['8. Math','Ask for missing inputs. Set up before calculating. Walk through your thinking and contextualize the final number.'],
['9. Market sizing','Top-down: population → segment → penetration / usage → frequency. Keep assumptions simple and explicit.'],
['10. Final recommendation','Answer first → support with numbers → one risk → mitigant → next step. Keep it around 30 seconds.'],
['Overall communication','Limit filler words, use confident language, speak slowly, structure everything, and practice mental math consistently.']
].map(([t,b],i)=>`<details class="case-step" ${i===0?'open':''}><summary>${esc(t)}</summary><div class="inside">${esc(b)}</div></details>`).join('')}

function offerScore(o){const p=state.profile.priorities||{},weights={learning:p.learning||3,location:p.location||3,comp:p.comp||3,wlb:p.wlb||3,mission:p.mission||3,prestige:p.prestige||3};const ratings=o.ratings||{learning:3,location:3,comp:3,wlb:3,mission:3,prestige:3};let num=0,den=0;Object.keys(weights).forEach(k=>{num+=(ratings[k]||3)*weights[k];den+=5*weights[k]});return Math.round(num/den*100)}

function dashboard(){const all=dueEntries(),items=[...all.filter(x=>taskStatus(x.id)!=='Completed'),...all.filter(x=>taskStatus(x.id)==='Completed')].slice(0,7);const appDates=state.applications.filter(a=>a.deadline&&!['Rejected','Offer','Accepted'].includes(a.status)).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,4);const ev=sampleCdoEvents(),peers=samplePeers();return `${head('','Home','')}${tabs([['list','Dashboard'],['calendar','Calendar']],homeMode,'home-mode')}${homeMode==='calendar'?calendarView():`<div class="pathway-progress"><div class="between"><h2 class="section-title">Your recruiting journey</h2><button class="inline" data-go="careers" data-open-roadmap="1">View roadmap →</button></div><div class="progress-rail">${['Explore','Network','Apply','Interview','Offer'].map((label,i)=>{const scored=[state.targetFirms.length>0,state.contacts.length>0,state.applications.some(a=>['Applied','Interview','Offer'].includes(a.status)),state.applications.some(a=>['Interview','Offer'].includes(a.status)),state.offers.length>0];const idx=Math.max(0,scored.lastIndexOf(true));return `<div class="progress-stage ${i<idx?'complete':i===idx?'current':''}"><span class="progress-dot">${i<idx?'✓':''}</span>${label}${i===idx?'<div class="small">You are here</div>':''}</div>`}).join('')}</div><div class="progress-caption">Green = milestones reached · Blue = current stage · Gray = ahead</div></div><div class="home-workspace"><section class="home-surface"><div class="home-surface-head"><h2>Do this week</h2><button class="btn tiny" data-modal="reminder">+ Add task</button></div>${items.length?items.map(homeTask).join(''):'<div class="home-empty">Nothing to do right now. Add a task to get started.</div>'}<button class="inline" data-go="deadlines" style="margin-top:12px">See all tasks →</button></section><section class="home-surface"><div class="home-surface-head"><h2>Upcoming deadlines</h2><button class="btn secondary tiny" data-go="deadlines">Open tracker</button></div>${appDates.length?appDates.map(a=>`<div class="home-deadline"><div class="grow"><div class="home-firm">${firmName(a.company)}</div><div class="home-role">${esc(a.role)} · Application deadline</div></div>${homeDueLabel(a.deadline,taskStatus('app-'+a.id)==='Completed')}</div>`).join(''):'<div class="home-empty">No application deadlines recorded.</div>'}</section><section class="home-surface"><div class="home-surface-head"><h2>Career Development Office</h2><span class="pill blue">Sample events</span></div>${ev.map(e=>`<div class="home-event"><div class="home-day"><strong>${esc(e.day)}</strong><span>Sample</span></div><div><div class="home-event-title">${esc(e.title)}</div><div class="home-event-meta">${esc(e.detail)}</div></div></div>`).join('')}<a class="inline" href="https://michiganross.umich.edu/undergraduate/bba/careers" target="_blank" rel="noopener">Official CDO information ↗</a></section><section class="home-surface"><div class="home-surface-head"><h2>Find a prep partner</h2><span class="pill blue">Example profiles</span></div>${peers.map(p=>`<div class="home-peer"><div class="home-peer-avatar">${esc(p.initial)}</div><div><div class="home-peer-name">${esc(p.name)} <span class="small dim">· ${esc(p.year)}</span></div><div class="home-peer-meta"><b>Looking for:</b> ${esc(p.want||p.note)}</div><div class="home-peer-meta"><b>Progress:</b> ${esc(p.progress||'Early preparation')}</div><div class="home-peer-meta"><b>Availability:</b> ${esc(p.available||'Evenings, flexible')}</div></div></div>`).join('')}<button class="btn secondary tiny" data-go="networking">Open networking →</button></section></div>`}`}


function deadlinesPage(){const all=dueEntries();return `${head('Keep everything on schedule','Deadlines & reminders','All tracked deadlines, ordered by date. Change the status of each task as you go.')}
<div class="card"><div class="between"><h2 class="section-title">Deadlines · earliest first</h2><button class="btn" data-modal="reminder">+ Add reminder</button></div><div style="margin-top:15px">${all.length?all.map(dueRow).join(''):'<div class="empty">No deadlines yet. Add an application, follow-up or reminder to see it here.</div>'}</div><div style="margin-top:14px"><button class="btn secondary" id="enableNotif">${state.notificationEnabled?'Browser alerts enabled':'Enable browser alerts'}</button></div></div><p class="source-note">Dates come from your applications, contacts and reminders. Confirm employer deadlines independently.</p>`}
function timeline(){
const year=state.profile.classYear||'Sophomore',industry=state.profile.paths?.[0]||'Consulting';
const items=(s,e,when,title,tasks)=>({start:s,end:e,when,title,tasks});
const consultingSoph=[
items(0,2,'Sep – Nov','Explore consulting',['Research consulting companies and their practice areas','Attend career fairs and introduce yourself to consultants']),
items(2,3,'Nov – Dec','Start networking',['Reach out to alumni and consultants for introductory conversations','Build relationships before February–April, when response rates may fall']),
items(3,5,'Dec – Feb','Build your network',['Prioritize additional coffee chats, especially if considering MBB','Record conversations and follow-up dates in your CRM']),
items(5,6,'Early Feb – Early Mar','Begin case practice',['Practice live cases 1–2 times per week','Find peers also recruiting for consulting','Attend MBB recruiting events when offered']),
items(6,6,'Early Mar – End of Mar','Build case confidence',['If targeting MBB, practice cases 2–3 times each week','Review feedback and improve weak case components']),
items(6,7,'End of Mar – End of Apr','Case intensively',['Practice cases 3–4 times per week until comfortable','Rehearse behavioral stories and final recommendations']),
items(7,8,'End of Apr – Early May','Potential MBB interviews',['Monitor Bain and McKinsey first- and second-round invitations','Keep time available for interviews and prepare thoughtful questions']),
items(8,11,'May – Aug','Broaden your firm search',['Network with Big 4 and boutique consulting firms','Watch for BCG opportunities around June/July and verify this year’s dates'])];
const consultingJunior=[
items(11,0,'Late Aug – End of Sep','Big 4 & boutique recruiting',['Submit applications to your selected Big 4 and boutique firms','Prepare for September interviews and case rounds','Track interview invitations, follow-ups, and firm-specific dates']),
items(1,2,'Oct – Nov','Continue targeted outreach',['Follow up with recruiters and alumni','Look for additional boutique or specialist openings','Prepare for remaining interview rounds']),
items(3,5,'Dec – Feb','Review your options',['Compare role and location across opportunities','Document interviews, feedback, and next steps']),
items(6,11,'Mar – Aug','Build experience',['Pursue off-cycle opportunities where available','Maintain contacts and strengthen relevant skills'])];
const custom={
'Investment Banking':[['Explore banks and finance clubs','Build accounting fundamentals','Learn differences between coverage and product groups'],['Network and develop technical skills','Schedule alumni coffee chats','Learn valuation, DCF, and financial statements'],['Track openings and interviews','Review each bank’s official recruiting calendar','Practice technical and behavioral questions'],['Prepare for next steps','Run mock technical interviews','Track superdays, thank-you notes, and offers']],
'Finance':[['Explore finance roles','Compare FP&A, corporate finance and asset management','Build Excel skills'],['Network and prepare','Schedule alumni calls','Practice valuation and accounting'],['Track applications','Add confirmed employer deadlines','Prepare technical answers'],['Interview and evaluate','Practice behavioral questions','Track recruiter follow-ups']],
'Technology':[['Explore roles','Compare product, strategy, engineering and analytics','Build portfolio projects'],['Network and research','Connect with alumni','Save relevant companies'],['Applications and practice','Track internship postings','Practice coding or product-sense questions'],['Interview and follow up','Review mock interviews','Track deadlines and recruiter updates']],
'Healthcare / Medtech':[['Explore healthcare paths','Research device, biotech, pharma and healthcare strategy roles','Collect technical projects'],['Connect and prepare','Reach out to alumni','Tailor resume to target functions'],['Track positions','Save confirmed application deadlines','Prepare project stories'],['Interview and follow up','Practice technical and behavioral responses','Log recruiter conversations']],
'Marketing':[['Explore specialties','Research brand, growth and consumer insights','Build examples of relevant work'],['Network with brands','Connect with alumni','Study consumers and markets'],['Apply and prepare','Track rotational programs','Practice campaign and marketing cases'],['Interview and evaluate','Prepare metric-driven stories','Follow up with contacts']],
'Engineering':[['Build technical depth','Compile project portfolio','Research roles and employers'],['Network and prepare','Meet alumni and engineering teams','Polish technical resume'],['Apply and practice','Watch verified posting dates','Practice technical screens'],['Interview and follow up','Prepare design trade-off explanations','Log interview takeaways']],
'Sustainability Consulting':[['Explore sustainability firms','Research climate, ESG and decarbonization roles','Attend industry events'],['Build connections','Network with sustainability consultants','Learn the main climate reporting frameworks'],['Apply and prepare','Track firm-specific opportunities','Practice strategy and sustainability cases'],['Interview and follow up','Develop project-based examples','Review recruiting conversations']]};
const nonConsulting=(custom[industry]||custom.Finance).map((row,i)=>{const periods=year==='Freshman'?[[0,2,'Sep – Nov'],[3,5,'Dec – Feb'],[6,8,'Mar – May'],[9,11,'Jun – Aug']]:year==='Sophomore'?[[0,2,'Sep – Nov'],[3,5,'Dec – Feb'],[6,8,'Mar – May'],[9,11,'Jun – Aug']]:year==='Junior'?[[11,1,'Aug – Oct'],[2,4,'Nov – Jan'],[5,7,'Feb – Apr'],[8,10,'May – Jul']]:[[0,2,'Sep – Nov'],[3,5,'Dec – Feb'],[6,8,'Mar – May'],[9,11,'Jun – Aug']];return items(periods[i][0],periods[i][1],periods[i][2],row[0],row.slice(1))});
const stages=industry==='Consulting'?(year==='Sophomore'?consultingSoph:year==='Junior'?consultingJunior:nonConsulting):nonConsulting;
const now=currentAcademicMonthIndex();const pastStage=x=>{if(x.start<=x.end)return now>x.end;return now>x.end&&now<x.start};
const phase=x=>isCurrentStage(x)?'current':pastStage(x)?'past':'future';
const shown=stages.map((x,i)=>({...x,i,phase:phase(x)}));const completed=shown.reduce((n,x)=>n+x.tasks.filter((_,j)=>taskStatus(`roadmap-${industry}-${year}-${x.i}-${j}`)==='Completed').length,0);const total=shown.reduce((n,x)=>n+x.tasks.length,0);
const rows=shown.map(x=>`<div class="pw-stage ${x.phase}"><div class="pw-point" aria-hidden="true"></div><div class="pw-stage-head"><div><span class="pw-when">${esc(x.when)}</span><span class="pw-phase">${x.phase==='current'?'YOU ARE HERE':x.phase==='past'?'EARLIER':'COMING UP'}</span></div><h3>${esc(x.title)}</h3></div><div class="pw-actions">${x.tasks.map((t,j)=>{const id=`roadmap-${industry}-${year}-${x.i}-${j}`,done=taskStatus(id)==='Completed';return `<div class="pw-action"><label class="pw-checkline"><input type="checkbox" data-roadmap-check="${esc(id)}" ${done?'checked':''}><span class="${done?'pw-complete':''}">${esc(t)}</span></label><button class="pw-add" data-roadmap-add="${esc(id)}" data-roadmap-text="${esc(t)}" title="Add this action to my tasks">+ Add to tasks</button></div>`}).join('')}</div></div>`).join('');
return `<div class="pw-roadmap"><div class="pw-toolbar"><div class="pw-controls"><label>Industry<select class="field" id="timelinePath">${Object.keys(careerPaths).map(x=>`<option ${industry===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Year<select class="field" id="timelineYear">${['Freshman','Sophomore','Junior','Senior'].map(x=>`<option ${year===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="pw-progress"><span>${completed} of ${total} actions completed</span><div class="pw-bar"><div style="width:${total?Math.round(completed/total*100):0}%"></div></div></div></div><div class="pw-legend"><span><i class="pw-legend-dot earlier"></i> Earlier</span><span><i class="pw-legend-dot current"></i> Current</span><span><i class="pw-legend-dot future"></i> Next</span></div><div class="pw-line">${rows}</div><p class="source-note">Consulting sophomore and junior milestones are based on the supplied September 30, 2026 guide. Other paths are illustrative planning suggestions. All employer-specific recruiting dates should be verified.</p></div>`;
}

function interviewPrep(){const paths=Object.keys(careerPaths),isCase=['Consulting','Sustainability Consulting'].includes(prepPath);const choices=isCase?[['structure','Case structure / flow'],['external','External practice'],['case','Case practice'],['math','Math practice'],['sizing','Market sizing practice'],['cdo','Ross CDO']]:[['guide','Interview guide'],['questions','Practice questions'],['external','External resources'],['cdo','Ross CDO']];return `${head('Practice by career path','Interview prep','Choose your industry, then open the exact activity you need.')}<div class="card" style="margin-bottom:15px"><div class="between"><div class="formgroup" style="min-width:230px"><label>Preparing for</label><select class="field" id="prepPath">${paths.map(p=>`<option ${prepPath===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div><span class="pill blue">${esc(prepPath)}</span></div></div>${tabs([['hub','All resources'],...choices],prepSection,'prep-section')}${prepSection==='hub'?`<div class="resource-grid">${choices.map(([key,title])=>`<button type="button" class="practice-tile" data-prep-section="${key}"><span class="practice-tile-icon">${key==='math'?'123':key==='sizing'?'◎':key==='structure'?'▤':key==='cdo'?'↗':'◇'}</span><span class="practice-tile-copy"><strong>${title}</strong><small>Open practice →</small></span></button>`).join('')}</div>`:prepSection==='cdo'?cdo():prepSection==='structure'?`<div class="card" style="max-width:850px"><h2 class="section-title">Consulting case structure & flow</h2><p class="dim">Click any step to expand.</p>${caseBlueprint()}</div>`:prepSection==='case'?casePracticeOnly():prepSection==='math'?mathPracticeOnly():prepSection==='sizing'?sizingPracticeOnly():prepSection==='external'?externalPractice(isCase):generalInterviewPractice(prepSection)}`}
function casePracticeOnly(){let c=casePrompts[caseIndex%casePrompts.length];return `<div class="card" style="max-width:900px"><div class="between"><h2 class="section-title">Interactive case practice</h2><div class="timer" id="caseTimer">${String(Math.floor(caseSeconds/60)).padStart(2,'0')}:${String(caseSeconds%60).padStart(2,'0')}</div></div><div class="prompt" style="margin:16px 0">${esc(c.prompt)}</div><div class="row"><button class="btn secondary" id="newCase">New prompt</button><button class="btn ghost" id="toggleCaseTimer">${caseTimer?'Pause timer':'Start timer'}</button></div>${[['caseClarify','Repeat-back & clarifying questions'],['caseFramework','Your MECE framework'],['caseRec','Final recommendation']].map(([id,label])=>`<div class="formgroup" style="margin-top:14px"><label>${label}</label><textarea id="${id}" class="field"></textarea></div>`).join('')}<div class="row" style="margin-top:14px"><button class="btn" id="saveCase">Save practice</button><button class="btn secondary" id="revealCase">Reveal suggested approach</button></div><div id="caseReveal"></div></div>`}
function mathPracticeOnly(){return `<div class="card" style="max-width:700px"><div class="between"><h2 class="section-title">60-second math drill</h2><span class="pill">Score <b id="mathScore">${math.score}</b></span></div>${math.active?`<div class="between" style="margin-top:15px"><span>Time remaining</span><b id="mathLeft">${math.left}s</b></div><div class="mathq">${math.a} ${math.op} ${math.b} = ?</div><input class="field" id="mathAnswer" placeholder="Answer + Enter" inputmode="numeric">`:`<p class="dim">Practice fast arithmetic used in interviews.</p><button class="btn" id="startMath">Start math drill</button>`}</div>`}
function sizingPracticeOnly(){return `<div class="card" style="max-width:800px"><div class="between"><h2 class="section-title">Market sizing</h2><button class="btn secondary" id="newSizing">New prompt</button></div><div class="prompt" id="sizingPrompt" style="margin:16px 0">${esc(marketSizing[0])}</div><label class="dim small">Structure your assumptions: total market → target segment → use → frequency</label><textarea class="field" rows="7" placeholder="Write your market sizing approach..."></textarea></div>`}
function externalPractice(isCase){return `<div class="card" style="max-width:800px"><h2 class="section-title">External practice resources</h2>${(isCase?[['RocketBlocks — consulting cases','https://www.rocketblocks.me/consulting.php'],['ZetaMac — mental math','https://arithmetic.zetamac.com/'],['Management Consulted','https://managementconsulted.com/']]:[['University of Michigan career resources','https://careercenter.umich.edu/'],['O*NET — role research','https://www.onetonline.org/'],['Ross BBA careers','https://michiganross.umich.edu/undergraduate/bba/careers']]).map(([name,url])=>`<div class="resource"><b>${name}</b><a class="btn secondary" href="${url}" target="_blank" rel="noopener">Visit ↗</a></div>`).join('')}</div>`}
const interviewGuides={'Investment Banking':['Walk me through a DCF','How do the three statements connect?','Explain accretion / dilution','Tell me about a recent M&A deal.'],'Finance':['Walk me through a DCF','How do the three financial statements connect?','Explain enterprise value vs. equity value','Tell me about a recent deal.'],'Technology':['Walk through a product improvement','Define success metrics for a product','Prioritize a feature roadmap','Explain a difficult technical decision.'],'Healthcare / Medtech':['Describe a project from design through testing','How do you balance safety, clinical need and cost?','Explain a technical problem to a clinician','Describe a regulatory or quality tradeoff.'],'Marketing':['Create a go-to-market plan','How would you segment a new audience?','Choose metrics for a campaign','Describe a successful campaign and why it worked.'],'Engineering':['Explain your most difficult technical project','How would you troubleshoot a failed design?','Walk through tradeoffs in a design decision','Describe how you validated results.']};
function generalInterviewPractice(section){let questions=interviewGuides[prepPath]||['Tell me about yourself','Why this role and industry?','Describe a time you navigated a challenge','Tell me about a time you worked on a team'];if(prepPath==='Sustainability Consulting')questions=['How would you assess a corporate decarbonization plan?','Compare scope 1, 2 and 3 emissions','How would you prioritize sustainability investments?','Describe an ESG project'];return `<div class="card" style="max-width:900px"><h2 class="section-title">${esc(prepPath)} interview practice</h2><p class="dim">Work through relevant technical, fit, and behavioral prompts.</p>${questions.map((q,i)=>`<details class="case-step"><summary>${i+1}. ${esc(q)}</summary><div class="inside"><textarea class="field" placeholder="Outline a structured response and specific evidence..."></textarea></div></details>`).join('')}<h3 style="margin-top:18px">Behavioral answer structure</h3><p class="dim">Situation → Task → Action → Result → Reflection. Focus on your own contribution and measurable outcomes.</p></div>`}
let deadlineSection='dates';
function careerWorkspace(){return `${head('','Career paths','')}${tabs([['explore','Explore careers & firms'],['roadmap','My recruiting roadmap']],careerSection,'career-section')}${careerSection==='roadmap'?timeline():careers()}`}
function pipelineWorkspace(){return `${head('Your recruiting pipeline','My recruiting','A simple overview of where every company stands.')}${tabs([['overview','Overview'],['applications','Applications'],['offers','Offers']],pipelineSection,'pipeline-section')}${pipelineSection==='overview'?recruitingOverview():pipelineSection==='applications'?applications():offers()}`}

function cdo(){return `<div class="grid two"><div class="card"><h2 class="section-title">Your CDO, right here</h2><p class="dim">Pathway complements Ross Career Development Office resources, not replaces them.</p><div class="resource"><div><b>Ross Career Development Office</b><div class="dim small">Advising, recruiting guidance, employer engagement and events.</div></div><a class="btn secondary" href="https://michiganross.umich.edu/undergraduate/bba/careers" target="_blank" rel="noopener">Visit ↗</a></div><div class="resource"><div><b>University of Michigan career platform</b><div class="dim small">Find career events and employer opportunities through your university account.</div></div><a class="btn secondary" href="https://careercenter.umich.edu/" target="_blank" rel="noopener">Visit ↗</a></div><div class="resource"><div><b>Find a resume or career appointment</b><div class="dim small">Use official university services for current availability.</div></div><a class="btn secondary" href="https://michiganross.umich.edu/undergraduate/bba/careers" target="_blank" rel="noopener">Explore ↗</a></div></div><div class="card"><h2 class="section-title">Your next step</h2><div class="item"><b>${esc(state.profile.classYear)} · ${esc(state.profile.paths?.[0]||'Consulting')}</b></div><p class="dim">Open your timeline to find the activities appropriate for your year. Add real employer deadlines in My recruiting so they appear on your home dashboard.</p><button class="btn" data-go="timeline">See my timeline →</button><p class="source-note">Official CDO pages open externally. Live CDO events and appointments are not connected in this offline demo.</p></div></div>`}
function playbooks(){if(playbookView==='create')return `${tabs([['browse','Explore playbooks'],['create','Create my playbook']],playbookView,'playbook-view')}<div class="card"><h2 class="section-title">Create your playbook</h2>${playbookCreator()}</div>`;return `${tabs([['browse','Explore playbooks'],['create','Create my playbook']],playbookView,'playbook-view')}<div class="card"><h2 class="section-title">Explore student playbooks</h2><p class="dim small">Tips and practical workflows shared by students.</p></div>`+playbookBrowse()}
function playbookBrowse(){let posts=state.playbooks||[];let tags=['All','Networking','Case prep','Applications','Interviews','Career exploration'];let shown=posts.filter(x=>playbookFilter==='All'||x.category===playbookFilter);return `<div class="grid two"><div><div class="card"><div class="between"><h2 class="section-title">Student playbooks</h2><span class="pill blue">Community resources</span></div><p class="dim small">A collection of steps, scripts and strategies from students who have navigated recruiting.</p><div class="chips" style="margin:16px 0">${tags.map(x=>`<button class="chip ${playbookFilter===x?'active':''}" data-playbook-filter="${esc(x)}">${esc(x)}</button>`).join('')}</div>${shown.map(post=>`<article class="playbook"><div class="between"><span class="pill blue">${esc(post.category)}</span><span class="dim small">${esc(post.author||'Student')}</span></div><h3>${esc(post.title)}</h3><p style="white-space:pre-wrap">${esc(post.body)}</p>${post.link?`<a href="${esc(safeExternal(post.link))}" target="_blank" rel="noopener noreferrer">View linked resource ↗</a>`:''}<div class="row" style="margin-top:12px"><button class="btn secondary tiny" data-like-playbook="${esc(post.id)}">♡ Helpful (${Number(post.likes||0)})</button>${post.owned?`<button class="btn ghost tiny" data-remove-playbook="${esc(post.id)}">Delete</button>`:''}</div></article>`).join('')||'<div class="empty">No playbooks in this category yet.</div>'}</div></div>`}
function playbookCreator(){return `<form id="playbookForm" style="display:grid;gap:12px;margin-top:15px"><div class="formgroup"><label>Title</label><input class="field" name="title" required maxlength="100" placeholder="How I found my case partner"></div><div class="formgroup"><label>Category</label><select class="field" name="category">${['Networking','Case prep','Applications','Interviews','Career exploration'].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="formgroup"><label>Your name</label><input class="field" name="author" value="${esc(state.profile.name||'Student')}" maxlength="60"></div><div class="formgroup"><label>Tips, steps or templates</label><textarea class="field" required name="body" rows="8" maxlength="4000"></textarea></div><div class="formgroup"><label>Helpful resource link (optional)</label><input class="field" name="link" type="url" placeholder="https://..."></div><button class="btn">Publish playbook</button></form><p class="source-note">Playbooks created in this offline prototype are saved locally, not publicly shared.</p>`}

function generateMath(){const ops=['+','−','×','÷'];const op=ops[Math.floor(Math.random()*ops.length)];let a,b,ans;if(op==='×'){a=2+Math.floor(Math.random()*23);b=2+Math.floor(Math.random()*12);ans=a*b}else if(op==='÷'){b=2+Math.floor(Math.random()*12);ans=2+Math.floor(Math.random()*20);a=b*ans}else if(op==='+'){a=10+Math.floor(Math.random()*190);b=10+Math.floor(Math.random()*190);ans=a+b}else{a=50+Math.floor(Math.random()*150);b=5+Math.floor(Math.random()*(a-5));ans=a-b}Object.assign(math,{a,b,op,answer:ans});}
function startMath(){clearInterval(math.timer);math.active=true;math.score=0;math.left=60;generateMath();render();setTimeout(()=>document.getElementById('mathAnswer')?.focus(),20);math.timer=setInterval(()=>{math.left--;const el=document.getElementById('mathLeft');if(el)el.textContent=math.left+'s';if(math.left<=0){clearInterval(math.timer);math.active=false;toast(`Math drill complete: ${math.score} correct`);render()}},1000)}

if(state.offers.length===0){state.offers.push({id:uid(),company:'Boston Consulting Group (BCG)',role:'Summer Associate',location:'Chicago, IL',base:95000,signon:5000,bonus:'Up to $10,000 (illustrative)',notes:'Illustrative demo offer — 10-week internship; hybrid client/team work; decision deadline Nov 20, 2026. All amounts and terms are fictional and not verified employer compensation.'});save()}
render();
